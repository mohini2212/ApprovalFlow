<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Approval Flow</title>

    <link rel="stylesheet" href="css/style.css">

    <style>
        .auth-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
            background: #f4f8ff;
        }

        .auth-container {
            width: 100%;
            max-width: 440px;
            background: #ffffff;
            padding: 40px;
            border-radius: 18px;
            box-shadow: 0 10px 40px rgba(30, 80, 150, 0.10);
        }

        .auth-logo {
            text-align: center;
            font-size: 26px;
            font-weight: 800;
            color: #168bfa;
            margin-bottom: 25px;
        }

        .auth-heading {
            text-align: center;
            margin-bottom: 28px;
        }

        .auth-heading h1 {
            font-size: 28px;
            color: #172b4d;
            margin-bottom: 8px;
        }

        .auth-heading p {
            color: #718096;
            font-size: 14px;
        }

        .login-type {
            display: flex;
            gap: 10px;
            margin-bottom: 24px;
        }

        .login-type button {
            flex: 1;
            padding: 12px;
            border: 1px solid #dce6f2;
            border-radius: 9px;
            background: #ffffff;
            color: #52647d;
            font-weight: 600;
            cursor: pointer;
        }

        .login-type button.active {
            background: #eaf4ff;
            border-color: #168bfa;
            color: #168bfa;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #344563;
            margin-bottom: 8px;
        }

        .form-group input {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #dce6f2;
            border-radius: 9px;
            font-size: 14px;
            outline: none;
            transition: 0.2s;
        }

        .form-group input:focus {
            border-color: #168bfa;
            box-shadow: 0 0 0 3px rgba(22, 139, 250, 0.10);
        }

        .password-box {
            position: relative;
        }

        .password-box input {
            padding-right: 65px;
        }

        .toggle-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            border: none;
            background: transparent;
            color: #168bfa;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
        }

        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin: 5px 0 22px;
            font-size: 13px;
        }

        .remember-option {
            display: flex;
            align-items: center;
            gap: 7px;
            color: #52647d;
        }

        .form-options a,
        .signup-link a {
            color: #168bfa;
            text-decoration: none;
            font-weight: 600;
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 9px;
            background: #168bfa;
            color: #ffffff;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
        }

        .login-btn:hover {
            background: #0875dc;
            transform: translateY(-1px);
        }

        .signup-link {
            text-align: center;
            margin-top: 25px;
            font-size: 14px;
            color: #718096;
        }

        .back-home {
            display: block;
            text-align: center;
            margin-top: 22px;
            color: #718096;
            text-decoration: none;
            font-size: 13px;
        }

        .back-home:hover {
            color: #168bfa;
        }

        @media (max-width: 480px) {
            .auth-container {
                padding: 28px 22px;
            }

            .auth-heading h1 {
                font-size: 24px;
            }

            .form-options {
                font-size: 12px;
            }
        }
    </style>
</head>

<body>

    <main class="auth-page">

        <div class="auth-container">

            <!-- Logo -->
            <div class="auth-logo">
                Approval Flow
            </div>

            <!-- Heading -->
            <div class="auth-heading">
                <h1>Welcome Back!</h1>
                <p>Log in to manage your creative approvals.</p>
            </div>

            <!-- Login Type -->
            <div class="login-type">
                <button type="button" class="active" id="agencyBtn">
                    Agency
                </button>

                <button type="button" id="clientBtn">
                    Client
                </button>
            </div>

            <!-- Login Form -->
            <form id="loginForm">

                <input type="hidden" id="loginRole" value="agency">

                <!-- Email -->
                <div class="form-group">
                    <label for="email">Email Address</label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email address"
                        required
                    >
                </div>

                <!-- Password -->
                <div class="form-group">
                    <label for="password">Password</label>

                    <div class="password-box">
                        <input
                            type="password"
                            id="password"
                            placeholder="Enter your password"
                            required
                            minlength="6"
                        >

                        <button
                            type="button"
                            class="toggle-password"
                            id="togglePassword"
                        >
                            Show
                        </button>
                    </div>
                </div>

                <!-- Remember and Forgot Password -->
                <div class="form-options">

                    <label class="remember-option">
                        <input type="checkbox" id="rememberMe">
                        Remember me
                    </label>

                    <a href="#" id="forgotPassword">
                        Forgot password?
                    </a>

                </div>

                <!-- Login Button -->
                <button type="submit" class="login-btn">
                    Login to Account
                </button>

            </form>

            <!-- Signup Link -->
            <div class="signup-link">
                Don't have an account?
                <a href="signup.html">Create Account</a>
            </div>

            <!-- Back to Home -->
            <a href="index.html" class="back-home">
                ← Back to Home
            </a>

        </div>

    </main>

    <script>
        // Select login elements
        const agencyBtn = document.getElementById("agencyBtn");
        const clientBtn = document.getElementById("clientBtn");
        const loginRole = document.getElementById("loginRole");

        // Switch between Agency and Client login
        agencyBtn.addEventListener("click", function () {
            loginRole.value = "agency";

            agencyBtn.classList.add("active");
            clientBtn.classList.remove("active");
        });

        clientBtn.addEventListener("click", function () {
            loginRole.value = "client";

            clientBtn.classList.add("active");
            agencyBtn.classList.remove("active");
        });

        // Show or hide password
        const passwordInput = document.getElementById("password");
        const togglePassword = document.getElementById("togglePassword");

        togglePassword.addEventListener("click", function () {
            if (passwordInput.type === "password") {
                passwordInput.type = "text";
                togglePassword.textContent = "Hide";
            } else {
                passwordInput.type = "password";
                togglePassword.textContent = "Show";
            }
        });

        // Login form submission
        const loginForm = document.getElementById("loginForm");

        loginForm.addEventListener("submit", function (event) {
            event.preventDefault();

            const email = document.getElementById("email").value.trim();
            const password = passwordInput.value;
            const role = loginRole.value;

            if (email === "" || password === "") {
                alert("Please fill in all the fields.");
                return;
            }

            alert(
                "Login form validated successfully!\n" +
                "Login Type: " + role.toUpperCase() +
                "\nEmail: " + email +
                "\n\nBackend authentication will be connected later."
            );
        });

        // Forgot password demo
        document.getElementById("forgotPassword")
            .addEventListener("click", function (event) {
                event.preventDefault();

                alert("Password reset functionality will be added later.");
            });
    </script>

</body>
</html>
