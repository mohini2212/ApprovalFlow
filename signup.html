<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account | ApprovalFlow</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f3f7fc;
            padding: 25px;
        }

        .signup-container {
            width: 100%;
            max-width: 460px;
            background: white;
            padding: 38px;
            border-radius: 16px;
            box-shadow: 0 8px 35px rgba(0, 0, 0, 0.08);
        }

        .logo {
            text-align: center;
            font-size: 27px;
            font-weight: bold;
            color: #2563eb;
            margin-bottom: 12px;
        }

        h2 {
            text-align: center;
            color: #1e293b;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            font-size: 14px;
            margin-bottom: 28px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #334155;
            margin-bottom: 8px;
        }

        input,
        select {
            width: 100%;
            padding: 13px;
            border: 1px solid #dbe2ea;
            border-radius: 8px;
            outline: none;
            font-size: 14px;
            background: #fff;
        }

        input:focus,
        select:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .terms {
            display: flex;
            align-items: flex-start;
            gap: 9px;
            margin: 20px 0;
            font-size: 13px;
            color: #64748b;
        }

        .terms input {
            width: auto;
            margin-top: 2px;
        }

        .terms label {
            font-weight: normal;
            line-height: 1.5;
            margin: 0;
        }

        .terms a {
            color: #2563eb;
            text-decoration: none;
        }

        button {
            width: 100%;
            padding: 14px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #1d4ed8;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .login-link {
            text-align: center;
            margin-top: 22px;
            font-size: 14px;
            color: #64748b;
        }

        .login-link a {
            color: #2563eb;
            text-decoration: none;
            font-weight: bold;
        }

        .message {
            margin-top: 15px;
            text-align: center;
            font-size: 14px;
        }

        @media(max-width: 480px) {
            .signup-container {
                padding: 25px 20px;
            }
        }
    </style>
</head>

<body>

    <div class="signup-container">

        <div class="logo">ApprovalFlow</div>

        <h2>Create Your Account</h2>

        <p class="subtitle">
            Get started with smarter creative approvals.
        </p>

        <form id="signupForm">

            <!-- Full Name -->
            <div class="form-group">
                <label for="fullName">Full Name</label>

                <input
                    type="text"
                    id="fullName"
                    name="name"
                    placeholder="Enter your full name"
                    required
                >
            </div>

            <!-- Email -->
            <div class="form-group">
                <label for="email">Email Address</label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >
            </div>

            <!-- Account Type -->
            <div class="form-group">
                <label for="accountType">Account Type</label>

                <select id="accountType" name="role" required>

                    <option value="">Select account type</option>

                    <option value="agency">Agency</option>

                    <option value="client">Client</option>

                </select>
            </div>

            <!-- Password -->
            <div class="form-group">
                <label for="password">Password</label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Create a password (minimum 8 characters)"
                    minlength="8"
                    required
                >
            </div>

            <!-- Confirm Password -->
            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>

                <input
                    type="password"
                    id="confirmPassword"
                    name="confirmPassword"
                    placeholder="Re-enter your password"
                    required
                >
            </div>

            <!-- Terms -->
            <div class="terms">

                <input
                    type="checkbox"
                    id="terms"
                    name="terms"
                >

                <label for="terms">
                    I agree to the
                    <a href="#">Terms & Conditions</a>
                    and
                    <a href="#">Privacy Policy</a>.
                </label>

            </div>

            <!-- Submit -->
            <button type="submit" id="signupButton">
                Create Account
            </button>

            <div id="signupMessage" class="message"></div>

        </form>

        <div class="login-link">

            Already have an account?

            <a href="login.html">Login</a>

        </div>

    </div>

    <!-- Authentication JavaScript -->
    <script src="js/auth.js"></script>

</body>
</html>
